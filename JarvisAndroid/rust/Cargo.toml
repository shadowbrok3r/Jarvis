[package]
name = "jarvis_android"
version = "0.1.1"
edition = "2024"
publish = false

# Own workspace so the desktop lockfile is not resolved against the Android
# feature set (mirrors JarvisIOS/rust).
[workspace]

[lib]
crate-type = ["cdylib"]

[features]
default = []
# Route text input through EguiMobile's hidden-EditText InputConnection instead
# of bevy_egui's winit `set_ime_allowed` path. Adds swipe typing, the Gboard
# spacebar cursor, and IME composition, but replaces a path that already works —
# hence opt-in. The Java half ships either way; it is inert until this is on.
ime-bridge = ["dep:egui-android-ime"]

[dependencies]
# The desktop library crate: config, act, ironclaw, pose_library, icons, theme,
# and the whole Bevy plugin stack. Android-only gates live in its `plugins/mod.rs`.
jarvis-avatar = { path = "../.." }

# `#[bevy_main]` expands to `bevy::android::...`, so `bevy` must stay a direct,
# unrenamed dependency. Feature set matches what the lib resolves on Android.
bevy = { version = "0.19", features = [
  "wav",
  "ktx2",
  "audio",
  "android-native-activity",
] }
bevy_vrm1 = "0.9"
bevy_egui = { version = "0.41.1", features = ["serde"] }
bevy_panorbit_camera = { path = "../../vendor/bevy_panorbit_camera", features = ["bevy_egui"] }
egui-phosphor = { version = "0.13.0", default-features = false, features = ["regular"] }

# AAssetManager for the first-run APK -> internal-storage asset extraction.
serde_json = "1"
ndk = "0.9"
# ime_bridge.rs lifted out of EguiMobile's egui-android (feature `ime-bridge`).
egui-android-ime = { path = "../../vendor/egui-android-ime", optional = true }
crossbeam-channel = "0.5"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "macros"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }
android_logger = "0.15"
log = "0.4"
tracing = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[patch.crates-io]
bevy_vrm1 = { path = "../../vendor/bevy_vrm1" }

[package.metadata.android]
package = "com.kingsofalchemy.jarvis"
# Bootstrap set only (~21 MB). The 2.1 GB desktop tree is never packaged; larger
# models arrive over the hub's /jarvis-ios/v1/asset/{path} endpoint.
assets = "assets"
# Launcher icons; regenerate with JarvisAndroid/scripts/render-icon.sh.
resources = "res"
# javac + d8 into classes.dex. EguiNativeActivity hosts the hidden EditText that
# owns the InputConnection; the bridge matches that class name exactly. Shipped
# unconditionally — it only subclasses NativeActivity, so it is inert when the
# `ime-bridge` feature is off.
java_sources = "java"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "Jarvis"
icon = "@mipmap/ic_launcher"
has_code = true
# The hub, Kokoro TTS, and Home Assistant are plain http:// on the LAN
# (192.168.4.x). targetSdk 28+ blocks cleartext by default, which would make
# every one of those requests fail. Same role as NSAllowsLocalNetworking on iOS.
uses_cleartext_traffic = true

[[package.metadata.android.application.activity]]
name = "com.github.egui_mobile.EguiNativeActivity"
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|density"
window_soft_input_mode = "adjustResize"
[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "jarvis_android"
[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

# Debug-keystore sideload so builds from any machine with that keystore install over each other.
[package.metadata.android.signing.release]
path = "~/.android/debug.keystore"
keystore_password = "android"

[profile.release]
opt-level = 3
lto = false
# Unstripped the cdylib is ~209 MB, which the APK carries into nativeLibraryDir.
strip = "symbols"

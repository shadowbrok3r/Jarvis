<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <!-- Pre-API-26 launcher icon: the mask is baked in and the art is scaled up,
       since there is no adaptive safe zone to reserve. -->
  <defs>
    <radialGradient id="bg" cx="0.42" cy="0.36" r="0.78">
      <stop offset="0%" stop-color="#18213D"/>
      <stop offset="55%" stop-color="#0B0E1A"/>
      <stop offset="100%" stop-color="#05070F"/>
    </radialGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="55%" stop-color="#5FC8FF"/>
      <stop offset="100%" stop-color="#B366FF"/>
    </linearGradient>
    <linearGradient id="halo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#FF40C8"/>
    </linearGradient>
    <clipPath id="mask">
      <rect x="4" y="4" width="100" height="100" rx="24" ry="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#mask)">
    <rect width="108" height="108" fill="url(#bg)"/>
    <circle cx="45" cy="38" r="40" fill="#00E5FF" opacity="0.08"/>
    <circle cx="78" cy="82" r="34" fill="#B366FF" opacity="0.07"/>

    <g transform="translate(54 54) scale(1.32) translate(-54 -54)">
      <circle cx="54" cy="54" r="30" fill="none" stroke="url(#halo)" stroke-width="3.5"
              stroke-linecap="round" opacity="0.55"
              stroke-dasharray="132 56" transform="rotate(128 54 54)"/>
      <g fill="none" stroke="url(#stroke)" stroke-width="9"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M 44 34 L 66 34"/>
        <path d="M 60 34 L 60 60 C 60 71 51 76 43 71"/>
      </g>
    </g>
  </g>
</svg>

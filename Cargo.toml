[package]
name = "jarvis-avatar"
version = "0.1.0"
edition = "2024"
description = "Bevy VRM viewer with IronClaw hub, gateway chat, and MCP pose tools"
readme = "README.md"

[[bin]]
name = "jarvis-avatar"
path = "src/main.rs"

[dependencies]
bevy = { version = "0.19", features = ["wav", "ktx2", "audio"] }
bevy_vrm1 = "0.9"
bevy_egui = { version = "0.41.1", features = ["serde"] }
bevy_panorbit_camera = { path = "vendor/bevy_panorbit_camera", features = ["bevy_egui"] }
egui_commonmark = { version = "0.24.0", default-features = false, features = ["pulldown_cmark"] }
egui_json_tree = "0.16.0"
rfd = "0.17.2"
egui-phosphor = { version = "0.13.0", default-features = false, features = ["regular"] }

# Channel-server hub (axum WS + HTTP) / async
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
crossbeam-channel = "0.5"
futures = "0.3"
rand = "0.10"

# HTTP (TTS + IronClaw gateway) + SSE
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
reqwest-eventsource = "0.6"
base64 = "0.23.0"
urlencoding = "2"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
hound = "3.5"

# RMCP server (exposes pose / A2F / Kimodo tools to IronClaw)
rmcp = { version = "3", features = [
    "server",
    "macros",
    "schemars",
    "transport-streamable-http-server",
    "transport-io",
    "reqwest",
] }
schemars = "1"
tonic = { version = "0.14.5", default-features = false, features = ["codegen", "transport"] }
tonic-prost = "0.14.5"
prost = "0.14.3"
prost-types = "0.14.3"
async-stream = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

# ACT parsing
regex = "1"
once_cell = "1"
thiserror = "2"
parking_lot = "0.12"

# Config
config = "0.15"
dotenvy = "0.15"
toml = "1"
half = "2.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[build-dependencies]
tonic-prost-build = "0.14.5"

[profile.release]
opt-level = 3
lto = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release-fast]
inherits = "release"
lto = false            # no link-time optimisation (biggest time saver)
codegen-units = 16     # more parallel codegen units; trades binary size for speed
opt-level = 2          # slightly faster than 3 to compile; runtime cost is negligible
strip = false          # keep symbols for legible stack traces during testing
debug = false          # no debug info (keeps binary small)
incremental = true     # cache unchanged crates between rebuilds


[patch.crates-io]
bevy_vrm1 = { path = "vendor/bevy_vrm1" }
